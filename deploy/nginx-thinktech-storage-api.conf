# nginx reverse proxy for the ThinkTech Storage API
# Install:  sudo cp nginx-thinktech-storage-api.conf /etc/nginx/sites-available/thinktech-storage-api
#           sudo ln -s /etc/nginx/sites-available/thinktech-storage-api /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
# HTTPS:    sudo certbot --nginx -d storage.example.com
#           (certbot adds the 443 server block and the HTTP -> HTTPS redirect)

server {
    listen 80;
    listen [::]:80;
    server_name storage.example.com;   # <-- your (sub)domain pointing at the VPS

    # Must be >= Storage:MaxFileSizeBytes (100 MB by default) plus multipart overhead.
    client_max_body_size 110m;

    location / {
        proxy_pass         http://127.0.0.1:5080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Stream uploads straight to the API instead of buffering them on nginx's disk first.
        proxy_request_buffering off;
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
    }
}
